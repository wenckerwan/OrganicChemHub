# Baota usually manages the full server block for the site.
# If the site already exists, copy only the two location blocks into the
# chem.wencker.top site config and keep Baota's SSL directives.

server {
    listen 80;
    server_name chem.wencker.top www.chem.wencker.top;

    location /static/ {
        alias /www/wwwroot/chem.wencker.top/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
