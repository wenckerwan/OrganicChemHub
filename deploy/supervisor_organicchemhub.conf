[program:organicchemhub]
directory=/www/wwwroot/chem.wencker.top
command=/www/wwwroot/chem.wencker.top/.venv/bin/gunicorn organic_chem_hub.wsgi:application --chdir /www/wwwroot/chem.wencker.top --bind 127.0.0.1:8000 --workers 2 --timeout 60
user=www
autostart=true
autorestart=true
startsecs=3
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/www/wwwlogs/organicchemhub.out.log
stderr_logfile=/www/wwwlogs/organicchemhub.err.log
