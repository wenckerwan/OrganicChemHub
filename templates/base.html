{% load static %}
<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OrganicChemHub{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/site.css' %}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg app-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">
        <span class="brand-mark">OC</span>
        <span>OrganicChemHub</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="{% url 'reaction_list' %}">人名反应</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'route_list' %}">合成路线</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'learning_resource_list' %}">学习资料</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'deploy_guide' %}">部署引导</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/">后台管理</a></li>
        </ul>
        <form class="d-flex compact-search" action="{% url 'reaction_list' %}" method="get">
          <input class="form-control" type="search" name="q" placeholder="搜索反应、试剂、考点" aria-label="搜索反应">
          <button class="btn btn-primary-ink" type="submit" aria-label="搜索">
            <i class="bi bi-search"></i>
          </button>
        </form>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer py-4 mt-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2 text-muted small">
      <span>OrganicChemHub 0.35</span>
      <span>有机化学人名反应与合成路线资料库</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/smiles-drawer@2.4.1/dist/smiles-drawer.min.js"></script>
  <script src="{% static 'js/chem-structure.js' %}"></script>
</body>
</html>
