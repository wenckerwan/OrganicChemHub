{% extends "base.html" %}
{% block title %}{{ msg.title }} | 消息中心{% endblock %}
{% block content %}
<section class="py-4">
  <div class="container" style="max-width:720px;">
    <a href="{% url 'messages' %}" class="btn btn-sm btn-outline-secondary mb-3">← 返回消息中心</a>
    <div class="quick-panel">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
          <h1 class="h4 mb-1">{{ msg.title }}</h1>
          <span class="badge bg-light text-dark">{{ msg.get_msg_type_display }}</span>
        </div>
        <small class="text-muted">{{ msg.created_at|date:"Y-m-d H:i" }}</small>
      </div>
      <hr>
      <div class="text-secondary" style="line-height:1.8;">
        {{ msg.content|linebreaksbr }}
      </div>
    </div>
  </div>
</section>
{% endblock %}
