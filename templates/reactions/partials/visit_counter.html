<div class="visit-counter-panel" aria-label="{{ title }}">
  <div class="visit-counter-panel__title">
    <i class="bi bi-activity me-1"></i>{{ title }}
  </div>
  <div class="visit-counter-panel__grid">
    <span>
      <strong>{{ stats.total }}</strong>
      <em>总访问量</em>
    </span>
    <span>
      <strong>{{ stats.today }}</strong>
      <em>今日访问量</em>
    </span>
  </div>
</div>
