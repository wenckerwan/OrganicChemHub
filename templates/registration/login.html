{% extends "base.html" %}

{% block title %}登录 | OrganicChemHub{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="quick-panel">
          <h2 class="h4 mb-4">登录</h2>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label" for="id_username">用户名</label>
              <input type="text" name="username" id="id_username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label" for="id_password">密码</label>
              <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            {% if form.errors %}
              <div class="alert alert-danger py-2 small">用户名或密码错误。</div>
            {% endif %}
            <button type="submit" class="btn btn-primary-ink w-100">登录</button>
            <p class="mt-3 text-center small text-muted">
              还没有账号？<a href="{% url 'register' %}">注册</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
