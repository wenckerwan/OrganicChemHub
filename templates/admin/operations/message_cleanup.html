{% extends "admin/base_site.html" %}

{% block content %}
<div class="module" style="padding:20px;max-width:760px;">
  <h1>消息清理</h1>
  {% if result %}
  <div class="messagelist"><div class="success">已清理 {{ result.deleted }} 条站内消息。</div></div>
  {% endif %}
  <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit" class="deletelink">清理</button></form>
</div>
{% endblock %}
