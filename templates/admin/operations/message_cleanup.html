{% extends "admin/base_site.html" %}

{% block content %}
<div class="och-admin-page">
  <div class="och-admin-page-header">
    <div>
      <p class="och-admin-eyebrow">Message Cleanup</p>
      <h1>消息清理</h1>
      <p>按时间范围清理过期站内消息。</p>
    </div>
    <a class="och-admin-action-button" href="{% url 'admin:och_message_broadcast' %}">发送消息</a>
  </div>

  {% if result %}
  <div class="och-admin-message och-admin-message--success">已清理 {{ result.deleted }} 条站内消息。</div>
  {% endif %}

  <form class="och-admin-form-card" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="och-admin-form-actions">
      <button type="submit" class="deletelink">清理</button>
    </div>
  </form>
</div>
{% endblock %}
