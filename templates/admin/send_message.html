{% extends "admin/base_site.html" %}
{% block content %}
<h1>发送站内消息</h1>
<p>向以下用户发送消息：</p>
<ul>
  {% for user in users %}
  <li>{{ user.username }} ({{ user.email }})</li>
  {% endfor %}
</ul>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="action" value="send_message_to_users">
  <input type="hidden" name="apply" value="1">
  <button type="submit" class="default">发送</button>
</form>
{% endblock %}
