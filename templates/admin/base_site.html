{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}OrganicChemHub 管理后台{% endblock %}

{% block extrahead %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'css/admin.css' %}">
<style>
  /* ── Dashboard layout ── */
  .dashboard-container { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; margin-bottom:28px; }
  .dashboard-card { background:#fff; border:1px solid #e0e5e8; border-radius:10px; padding:18px; }
  .dashboard-card h3 { font-size:0.8rem; color:#667085; text-transform:uppercase; letter-spacing:0.06em; margin:0 0 8px; }
  .dashboard-card .num { font-size:2rem; font-weight:800; margin:0; }
  .dashboard-card .badge { font-size:0.7rem; }
  .dash-red .num { color:#dc2626; }
  .dash-green .num { color:#15803d; }
  .dash-teal .num { color:#0f766e; }
  .dash-amber .num { color:#a16207; }
  .dash-blue .num { color:#0369a1; }

  /* ── Module card grouping ── */
  .app-module { background:#fff; border:1px solid #e0e5e8; border-radius:10px; padding:0; margin-bottom:20px; overflow:hidden; }
  .app-module h2 { background:#f4f6f8; margin:0; padding:12px 16px; font-size:0.95rem; border-bottom:1px solid #e0e5e8; }
  .app-module .table { margin:0; }
  .app-module th, .app-module td { padding:10px 16px !important; }

  /* ── Sidebar nav grouping ── */
  #nav-sidebar .section { margin-bottom:12px; }
  #nav-sidebar .section .section-header { font-weight:700; color:#132926; font-size:0.82rem; text-transform:uppercase; letter-spacing:0.04em; padding:10px 0 4px; }
  #nav-sidebar .section a { padding:5px 0; }
</style>
{% endblock %}

{% block branding %}
<div class="och-admin-brand">
  <strong>OrganicChemHub</strong>
  <span>有机化学资料维护台</span>
</div>
{% endblock %}
