{% if node %}
<ul style="list-style:none;padding-left:16px;margin:4px 0;">
{% for key, value in node.items %}
  {% if key == "item_pk" %}
    <li>📄 <a href="{% url 'admin:reactions_learningresource_change' value %}">{{ node.item_title }}</a></li>
  {% elif key != "item_title" and key != "is_leaf" %}
    <li><strong>📁 {{ key }}</strong>
      {% include "admin/reactions/tree_branch.html" with node=value %}
    </li>
  {% endif %}
{% endfor %}
</ul>
{% endif %}
